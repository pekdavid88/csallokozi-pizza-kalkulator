<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Csallóközi Pizzatészta Kalkulátor</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }

    .calculator-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: #fff;
    }

    p.subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: var(--text-muted);
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    input[type="number"], select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus, select:focus {
      border-color: var(--accent);
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.25rem;
    }

    .results-table th, .results-table td {
      padding: 0.65rem 0.5rem;
      text-align: left;
      font-size: 0.95rem;
    }

    .results-table th {
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .results-table tr:not(:last-child) td {
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
    }

    .results-table td.val {
      text-align: right;
      font-weight: 700;
      color: var(--accent);
    }

    .results-table td.pct {
      text-align: right;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .summary-box {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .summary-box span.total-weight {
      font-weight: 700;
      color: var(--accent);
      font-size: 1.05rem;
    }

    .steps-card {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }

    .steps-card h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.75rem;
    }

    .steps-list {
      list-style: none;
      counter-reset: step-counter;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .steps-list li {
      counter-increment: step-counter;
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.4;
    }

    .steps-list li::before {
      content: counter(step-counter);
      background: var(--border);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.75rem;
      min-width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
      flex-shrink: 0;
    }

    .steps-list strong {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="calculator-card">
    <h1>Csallóközi Büfé Pizza</h1>
    <p class="subtitle">Plehes tészta kalkulátor (59% hidratáció)</p>

    <div class="input-row">
      <div class="form-group">
        <label for="count">Bucik száma (db)</label>
        <input type="number" id="count" value="4" min="1" max="100">
      </div>
      <div class="form-group">
        <label for="weight">Buci súly (g)</label>
        <input type="number" id="weight" value="300" min="150" max="500" step="5">
      </div>
    </div>

    <div class="form-group">
      <label for="method">Kelesztési eljárás</label>
      <select id="method">
        <option value="same-day">Aznapi (szobahőn, ~2-3 óra)</option>
        <option value="cold">Másnapi hűtőzött (24-48 óra)</option>
      </select>
    </div>

    <table class="results-table">
      <thead>
        <tr>
          <th>Hozzávaló</th>
          <th style="text-align: right;">Arány</th>
          <th style="text-align: right;">Mennyiség</th>
        </tr>
      </thead>
      <tbody id="ingredients-body">
        <!-- JS generálja -->
      </tbody>
    </table>

    <div class="summary-box">
      <span>Tészta összsúlya:</span>
      <span class="total-weight" id="total-weight">1080 g</span>
    </div>

    <div class="steps-card">
      <h2>Munkamenet (<span id="method-title">Aznapi</span>)</h2>
      <ol class="steps-list" id="workflow-steps">
        <!-- JS cseréli az eljárás szerint -->
      </ol>
    </div>
  </div>

  <script>
    const countInput = document.getElementById('count');
    const weightInput = document.getElementById('weight');
    const methodSelect = document.getElementById('method');
    const tbody = document.getElementById('ingredients-body');
    const totalWeightEl = document.getElementById('total-weight');
    const workflowStepsEl = document.getElementById('workflow-steps');
    const methodTitleEl = document.getElementById('method-title');

    const HYDRATION = 0.6;
    const OIL_PCT = 0.025;
    const SALT_PCT = 0.021;
    const SUGAR_PCT = 0.014;

    const workflows = {
      'same-day': [
        '<strong>Dagasztás:</strong> Oldd fel a vízben az élesztőt és a cukrot. Add hozzá a lisztet, a sót és az olajat, majd dagassz sima, rugalmas tésztát (kb. 8–10 perc).',
        '<strong>Tömbi kelés:</strong> Lefedett tálban pihentesd szobahőmérsékleten 1,5–2 órát, amíg nagyjából a duplájára kel.',
        '<strong>Porciózás:</strong> Oszd el a megadott grammsúlyú bucikra, gömbölyítsd feszesre, és tedd lefedve pihenni 45–60 percre.',
        '<strong>Formázás:</strong> Nyújtsd ki kézzel vagy sodrófával, fektesd vékonyan kiolajozott plehre, simítsd ki a peremekig.',
        '<strong>Sütés:</strong> Szósz, sajt, feltétek rá, majd 300°C-on süsd kb. 5–7 percig, amíg a sajt és a széle megpirul.'
      ],
      'cold': [
        '<strong>Dagasztás:</strong> Hideg vízzel keverd össze a hozzávalókat (cukor, élesztő, liszt, só, olaj), és dagaszd simára a tésztát.',
        '<strong>Azonnali porciózás:</strong> Ne várd meg a kelesztést; mérd ki azonnal a bucikat, gömbölyítsd feszesre, és vékonyan kend le őket olajjal.',
        '<strong>Hűtés:</strong> Légmentesen zárt dobozban tedd hűtőbe (3–5°C) 24–48 órás hideg érlelésre.',
        '<strong>Temperálás:</strong> Sütés előtt 1,5–2 órával vedd ki szobahőre a zárt ládát, hogy a bucik felmelegedjenek és ellazuljanak.',
        '<strong>Formázás és sütés:</strong> Enyhén lisztezett felületről tedd a vékonyan olajozott plehre, húzd ki a szélekig, pakold meg a feltétekkel, és 300°C-on süsd 5–7 perc alatt készre.'
      ]
    };

    function calculate() {
      const count = Math.max(1, parseInt(countInput.value) || 1);
      const weight = Math.max(50, parseInt(weightInput.value) || 270);
      const isSameDay = methodSelect.value === 'same-day';

      const totalDough = count * weight;
      const instantYeastPct = isSameDay ? 0.0045 : 0.0018;

      const totalFactor = 1 + HYDRATION + OIL_PCT + SALT_PCT + SUGAR_PCT + instantYeastPct;

      const flour = totalDough / totalFactor;
      const water = flour * HYDRATION;
      const oil = flour * OIL_PCT;
      const salt = flour * SALT_PCT;
      const sugar = flour * SUGAR_PCT;
      const yeastInstant = flour * instantYeastPct;
      const yeastFresh = yeastInstant * 3;

      const items = [
        { name: 'Liszt (T650 vagy 00)', pct: '100%', val: `${Math.round(flour)} g` },
        { name: 'Víz', pct: `${(HYDRATION * 100).toFixed(0)}%`, val: `${Math.round(water)} ml` },
        { name: 'Olaj (napraforgó/olíva)', pct: `${(OIL_PCT * 100).toFixed(1)}%`, val: `${Math.round(oil)} g` },
        { name: 'Só', pct: `${(SALT_PCT * 100).toFixed(1)}%`, val: `${(salt).toFixed(1)} g` },
        { name: 'Cukor', pct: `${(SUGAR_PCT * 100).toFixed(1)}%`, val: `${(sugar).toFixed(1)} g` },
        { 
          name: isSameDay ? 'Szárított élesztő (vagy friss)' : 'Szárított élesztő (hideg érleléshez)', 
          pct: `${(instantYeastPct * 100).toFixed(2)}%`, 
          val: `${yeastInstant.toFixed(1)} g (${Math.round(yeastFresh)} g friss)` 
        }
      ];

      tbody.innerHTML = items.map(item => `
        <tr>
          <td>${item.name}</td>
          <td class="pct">${item.pct}</td>
          <td class="val">${item.val}</td>
        </tr>
      `).join('');

      totalWeightEl.textContent = `${totalDough} g`;

      methodTitleEl.textContent = isSameDay ? 'Aznapi gyors kelesztés' : 'Hideg érleléses technológia';
      const steps = workflows[methodSelect.value];
      workflowStepsEl.innerHTML = steps.map(step => `<li><div>${step}</div></li>`).join('');
    }

    countInput.addEventListener('input', calculate);
    weightInput.addEventListener('input', calculate);
    methodSelect.addEventListener('change', calculate);

    calculate();
  </script>
</body>
</html>
